name: wargame

x-tool-image: &tool-image
  image: wargame-tools:latest
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  environment: &tool-environment
    WARGAME_PG_HOST: postgres
    WARGAME_PG_PORT: "5432"
    WARGAME_PG_DB: wargame
    WARGAME_PG_USER: wargame
    WARGAME_PG_PASSWORD: ${WARGAME_POSTGRES_PASSWORD:?Run setup.ps1 or setup.sh first}
    WARGAME_NEO4J_URI: bolt://neo4j:7687
    WARGAME_NEO4J_USER: neo4j
    WARGAME_NEO4J_PASS: ${WARGAME_NEO4J_PASSWORD:?Run setup.ps1 or setup.sh first}
    WARGAME_NEO4J_DATABASE: neo4j

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: wargame
      POSTGRES_DB: wargame
      POSTGRES_PASSWORD: ${WARGAME_POSTGRES_PASSWORD:?Run setup.ps1 or setup.sh first}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${WARGAME_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/Wargame_Schema_PostgreSQL.sql:/docker-entrypoint-initdb.d/10-wargame.sql:ro
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wargame -d wargame && psql -U wargame -d wargame -Atqc 'SELECT 1 FROM public.workflow_transition LIMIT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  neo4j:
    image: neo4j:5.26.0-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${WARGAME_NEO4J_PASSWORD:?Run setup.ps1 or setup.sh first}
      WARGAME_NEO4J_PASSWORD: ${WARGAME_NEO4J_PASSWORD:?Run setup.ps1 or setup.sh first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_bolt_advertised__address: localhost:${WARGAME_NEO4J_BOLT_PORT:-17687}
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:${WARGAME_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${WARGAME_NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$WARGAME_NEO4J_PASSWORD\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s

  bootstrap:
    <<: *tool-image
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  web:
    <<: *tool-image
    entrypoint: ["python", "/opt/wargame/web/app.py"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WARGAME_WEB_PORT:-8080}:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10

  tools:
    <<: *tool-image
    profiles: ["tools"]
    command: ["help"]
    volumes:
      - ./data:/data:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
