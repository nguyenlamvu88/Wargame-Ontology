name: giwg

x-tool-image: &tool-image
  image: giwg-tools:1.2
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  environment: &tool-environment
    GIWG_PG_HOST: postgres
    GIWG_PG_PORT: "5432"
    GIWG_PG_DB: giwg
    GIWG_PG_USER: giwg
    GIWG_PG_PASSWORD: ${GIWG_POSTGRES_PASSWORD:?Run setup.ps1 or setup.sh first}
    GIWG_NEO4J_URI: bolt://neo4j:7687
    GIWG_NEO4J_USER: neo4j
    GIWG_NEO4J_PASS: ${GIWG_NEO4J_PASSWORD:?Run setup.ps1 or setup.sh first}
    GIWG_NEO4J_DATABASE: neo4j

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: giwg
      POSTGRES_DB: giwg
      POSTGRES_PASSWORD: ${GIWG_POSTGRES_PASSWORD:?Run setup.ps1 or setup.sh first}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${GIWG_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/GIWG_Schema_PostgreSQL.sql:/docker-entrypoint-initdb.d/10-giwg.sql:ro
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U giwg -d giwg && psql -U giwg -d giwg -Atqc 'SELECT 1 FROM public.workflow_transition LIMIT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  neo4j:
    image: neo4j:5.26.0-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${GIWG_NEO4J_PASSWORD:?Run setup.ps1 or setup.sh first}
      GIWG_NEO4J_PASSWORD: ${GIWG_NEO4J_PASSWORD:?Run setup.ps1 or setup.sh first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_bolt_advertised__address: localhost:${GIWG_NEO4J_BOLT_PORT:-17687}
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:${GIWG_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${GIWG_NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$GIWG_NEO4J_PASSWORD\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s

  bootstrap:
    <<: *tool-image
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  tools:
    <<: *tool-image
    profiles: ["tools"]
    command: ["help"]
    volumes:
      - ./data:/data:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
