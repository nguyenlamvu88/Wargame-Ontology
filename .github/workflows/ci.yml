name: GIWG checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giwg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            src/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r src/requirements-dev.txt
      - name: Run Python and JSON contract checks
        run: python -m pytest src/tests/test_validation.py -q
      - name: Run PostgreSQL engine checks
        working-directory: src
        run: |
          npm ci
          npm run test:sql

  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable test credentials
        run: sh setup.sh
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Run tests inside the tools image
        run: docker compose run --rm tools test
      - name: Test the full PostgreSQL to Neo4j pipeline
        run: docker compose run --rm tools smoke-test
      - name: Verify a repeated sync
        run: docker compose run --rm tools smoke-test
      - name: Show container state and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150 bootstrap postgres neo4j
      - name: Remove disposable CI databases
        if: always()
        run: docker compose down --volumes --remove-orphans
